"zh":"最近練習","th":"การฝึกล่าสุด"},"progress":{"zh":"學習進度","th":"ความคืบหน้าการเรียน"},"summary":{"zh":"總練習","th":"สรุปการฝึก"},"retry":{"zh":"重試","th":"ลองอีกครั้ง"},"accountHint":{"zh":"請使用老師提供的 email 與個別密碼。","th":"กรุณาใช้อีเมลและรหัสผ่านส่วนตัวที่ครูให้"},"feedback":{"zh":"回饋","th":"ความคิดเห็น"},"noQuestions":{"zh":"這個題本尚無題目。","th":"เล่มนี้ยังไม่มีข้อคำถาม"},"type_sentence":{"zh":"單句理解","th":"ความเข้าใจประโยค"},"type_cloze":{"zh":"選詞填空","th":"เลือกคำเติมในช่องว่าง"},"type_passage":{"zh":"閱讀理解","th":"ความเข้าใจบทอ่าน"},"questionNo":{"zh":"題號","th":"ข้อ"},"imageZoom":{"zh":"放大題目","th":"ขยายภาพข้อสอบ"},"imageError":{"zh":"題目圖片無法載入，請重新整理。","th":"โหลดภาพข้อสอบไม่สำเร็จ กรุณาโหลดหน้าใหม่"},"audioError":{"zh":"音檔無法播放，請重新整理後再試。","th":"เล่นไฟล์เสียงไม่สำเร็จ กรุณาโหลดหน้าใหม่แล้วลองอีกครั้ง"},"type_picture_answer":{"zh":"看圖回答","th":"ตอบคำถามจากภาพ"},"type_single_dialogue":{"zh":"問答理解","th":"ความเข้าใจคำถามและคำตอบ"},"type_multi_dialogue":{"zh":"對話理解","th":"ความเข้าใจบทสนทนา"},"type_dialogue":{"zh":"對話","th":"บทสนทนา"},"type_monologue":{"zh":"段落聽力","th":"ฟังข้อความ"},"type_picture_description":{"zh":"看圖釋義","th":"เลือกคำอธิบายภาพ"},"type_paragraph":{"zh":"完成段落","th":"เติมบทอ่านให้สมบูรณ์"}},lang:'th',token:storageGet('localStorage','tocfl-session')||storageGet('sessionStorage','tocfl-session'),student:null,catalog:[],attempts:[],questions:[],view:'login',mode:'book',book:null,index:0,selected:null,result:null,pendingId:null,busy:false,error:'',type:null,feedbackUrl:''};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=k=>state.messages[k]?.[state.lang]||state.messages[k]?.zh||k;
const label=b=>`BAND ${b.band}・Volume ${b.volume}`;
const API_URL='https://script.google.com/macros/s/AKfycbwtUzCfumsbjWczGtk-0LpJxz3QLdC2ZWQi6U_dw15BpVUOXBUoZbmPS7mWgGc_fwxA/exec';
function rpc(method,...args){return new Promise((resolve,reject)=>{
  const id=crypto.randomUUID(), frame=document.createElement('iframe'), form=document.createElement('form');
  frame.name='tocfl-'+id;frame.hidden=true;frame.title='Background request';form.hidden=true;
  form.method='POST';form.action=API_URL;form.target=frame.name;
  const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({id,method,args,origin:location.origin});form.append(input);
  let timer;function finish(error,value){clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();error?reject(error):resolve(value);}
  function receive(event){let origin;try{origin=new URL(event.origin);}catch{return;}
    if(origin.protocol!=='https:'||!(origin.hostname==='script.google.com'||origin.hostname.endsWith('-script.googleusercontent.com')||origin.hostname==='script.googleusercontent.com'))return;
    const data=event.data;if(!data||data.channel!=='tocfl-rpc'||data.id!==id)return;
    data.ok?finish(null,data.result):finish(new Error(data.error||'REQUEST_FAILED'));
  }
  window.addEventListener('message',receive);timer=setTimeout(()=>finish(new Error('REQUEST_TIMEOUT')),45000);
  document.body.append(frame,form);form.submit();
});}
async function derived(password,salt){const e=new TextEncoder(),key=await crypto.subtle.importKey('raw',e.encode(password),'PBKDF2',false,['deriveBits']);const bytes=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(salt),iterations:600000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bytes),v=>v.toString(16).padStart(2,'0')).join('');}
function switchLanguage(){state.lang=state.lang==='zh'?'th':'zh';storageSet('localStorage','tocfl-language',state.lang);render();}
function recent(questionId){return state.attempts.filter(a=>a.question_id===questionId).at(-1);}
function forBook(b){const ids=new Set((b.items||[]).map(q=>q.id));return state.attempts.filter(a=>a.band===b.band&&Number(a.volume)===Number(b.volume)&&a.skill===b.skill&&ids.has(a.question_id));}
function unique(b){return Object.values(Object.fromEntries(forBook(b).map(a=>[a.question_id,a])));}
function clearSession(){state.token='';state.student=null;state.attempts=[];state.catalog=[];state.questions=[];state.book=null;state.result=null;state.view='login';storageRemove('localStorage','tocfl-session');storageRemove('sessionStorage','tocfl-session');}
window.addEventListener?.('storage',event=>{if(event.key==='tocfl-session'&&!event.newValue){clearSession();state.busy=false;state.error='';render();}});
function failure(err){const expired=/SESSION_EXPIRED/.test(String(err.message));if(expired){clearSession();}state.error=text(expired?'expired':'error');state.busy=false;render();}
function busy(){state.busy=true;state.error='';render();}
async function init(){try{const b=await rpc('bootstrap');state.messages={...state.messages,...b.messages};state.feedbackUrl=/^https:\/\//.test(b.feedbackUrl)?b.feedbackUrl:'';if(state.token)await refresh();else {state.busy=false;render();}}catch(err){failure(err);}}
async function refresh(){const token=state.token,d=await rpc('dashboard',token);if(token!==state.token)return;storageSet('localStorage','tocfl-session',token);storageRemove('sessionStorage','tocfl-session');Object.assign(state,{student:d.student,catalog:d.catalog,attempts:d.attempts,view:'home',busy:false});render();}
async function signIn(event){event.preventDefault();const email=$('email').value,password=$('password').value;busy();try{const c=await rpc('loginStart',email),d=await derived(password,c.salt),r=await rpc('loginFinish',c.challenge,d);state.token=r.token;storageSet('localStorage','tocfl-session',r.token);await refresh();}catch(err){state.busy=false;state.error=text('loginError');render();}}
async function signOut(){const token=state.token;clearSession();state.error='';state.busy=false;render();try{await rpc('logout',token);}catch(err){/* Local logout succeeds offline; server token expires after eight hours. */}}
async function home(){busy();try{await refresh();}catch(err){failure(err);}}
function setMode(mode){state.mode=mode;render();}
async function openBook(b,questionId){busy();try{state.book=b;state.questions=await rpc('loadBook',state.token,b.band,Number(b.volume),b.skill,state.mode==='browse');state.type=null;state.index=questionId?Math.max(0,state.questions.findIndex(q=>q.question_id===questionId)):state.mode==='book'?Math.max(0,state.questions.findIndex(q=>!recent(q.question_id))):0;state.selected=null;state.result=null;state.pendingId=null;state.view=state.mode==='type'?'types':'question';state.busy=false;render();}catch(err){failure(err);}}
function chooseType(type){state.type=type;state.index=0;state.view='question';render();}
function activeQuestions(){return state.type?state.questions.filter(q=>q.type===state.type):state.questions;}
function move(delta){state.index+=delta;state.selected=null;state.result=null;state.pendingId=null;state.error='';render();}
function choose(i){if(state.busy||state.result)return;state.selected=i;render();}
async function submit(){if(state.selected===null||state.busy||state.result)return;const q=activeQuestions()[state.index];state.pendingId ||= crypto.randomUUID();busy();try{const r=await rpc('answer',state.token,q.question_id,state.selected,state.pendingId,state.mode==='type'?'type':'book');state.result=r;if(!state.attempts.some(a=>a.attempt_id===r.attempt_id))state.attempts.push(r);state.busy=false;render();}catch(err){failure(err);}}
async function showRecords(){busy();try{const d=await rpc('dashboard',state.token);state.attempts=d.attempts;state.catalog=d.catalog;state.view='records';state.busy=false;render();}catch(err){failure(err);}}
function btn(action,key,cls='',disabled=false){return `<button class="${cls}" onclick="${action}" ${disabled?'disabled':''}>${esc(text(key))}</button>`;}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-Hant':'th';$('language').textContent=state.lang==='zh'?'ภาษาไทย':'中文';$('studentName').textContent=state.student?`${text('hello')}，${state.student.name}`:'';$('logout').hidden=!state.student;$('logout').textContent=text('logout')+' · Log out';$('logout').disabled=state.busy;$('credit').textContent=text('credit');$('notice').innerHTML=`<div class="note">${esc(text('demo'))}</div>`;let body='';
if(state.view==='login'&&state.busy&&state.token)body=`<section class="card login" role="status" aria-live="polite" aria-busy="true"><p>${esc(text('loading'))}</p></section>`;
else if(state.view==='login')body=`<section class="card login"><h1>${esc(text('login'))}</h1><p>${esc(text('accountHint'))}</p><form onsubmit="signIn(event)"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required ${state.busy?'disabled':''}><label for="password">${esc(text('password'))}</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" ${state.busy?'disabled':''}><p class="status">${state.busy?esc(text('loading')):''}</p><button type="submit" class="primary wide" ${state.busy?'disabled':''}>${esc(text('enter'))}</button></form></section>`;
if(state.view==='home'){const bands=state.student.bands;body=`<h1>${esc(text('welcome'))}</h1><div class="modes">${['book','type','browse'].map(m=>btn(`setMode('${m}')`,m,state.mode===m?'primary':'',state.busy)).join('')}</div>`;if(!bands.length)body+=`<p>${esc(text('noAccess'))}</p>`;for(const band of bands){body+=`<h2>BAND ${esc(band)}</h2><div class="grid">`;for(const volume of [...new Set(state.catalog.filter(c=>c.band===band).map(c=>Number(c.volume)))].sort((a,b)=>a-b)){body+=`<section class="card"><h2 class="tag">BAND ${esc(band)}・Volume ${volume}</h2>`;for(const skill of ['listening','reading']){const b=state.catalog.find(c=>c.band===band&&Number(c.volume)===volume&&c.skill===skill)||{band,volume,skill,status:'unavailable',total:0};const count=unique(b).length,enabled=['demo','published'].includes(b.status)&&b.total>0;const position=state.catalog.indexOf(b);body+=`<div class="record"><div class="row"><strong>${esc(text(skill))}</strong><span>${enabled?`${count} / ${b.total}`:esc(text('unavailable'))}</span></div><div class="bar"><span style="width:${b.total?Math.min(100,count/b.total*100):0}%"></span></div>${btn(`openBook(state.catalog[${position}])`,!enabled?'unavailable':state.mode==='browse'?'browse':state.mode==='type'?'chooseType':count&&count<b.total?'continue':'start','wide',!enabled||state.busy)}</div>`;}body+='</section>';}body+='</div>';}body+=`<div class="row record">${btn('showRecords()','records','',state.busy)}<a href="https:\x2f\x2ftocfl.edu.tw/tocfl/index.php/exam/test/page/19" target="_blank" rel="noopener">${esc(text('official'))}</a>${state.feedbackUrl?`<a href="${esc(state.feedbackUrl)}" target="_blank" rel="noopener">${esc(text('feedback'))}</a>`:''}</div>`;}
if(state.view==='types'){body=btn('home()','home','',state.busy)+`<h1>${esc(label(state.book))}・${esc(text(state.book.skill))}</h1><h2>${esc(text('chooseType'))}</h2>`;body+=Array.from(new Set(state.questions.map(q=>q.type))).map(type=>`<p><button class="wide" onclick="chooseType('${esc(type)}')">${esc(text(type))}</button></p>`).join('');}
if(state.view==='question'){const qs=activeQuestions(),q=qs[state.index];body=btn('home()','home','',state.busy)+`<h1>${esc(label(state.book))}・${esc(text(state.book.skill))}</h1>`;if(!q)body+=`<p>${esc(text('noQuestions'))}</p>`;else {const browse=state.mode==='browse',answerIndex=browse?q.answer_index:state.result?.answerIndex;body+=`<section class="card question"><div class="row"><span>${esc(text('questionNo'))} ${q.number} / ${state.questions.length}</span><span>${esc(text(q.type))}</span></div><div class="bar"><span style="width:${(state.index+1)/qs.length*100}%"></span></div>`;if(state.book.skill==='listening')body+=q.audio_url&&/^https:\/\//.test(q.audio_url)?`<audio controls controlslist="nodownload" preload="none" onerror="this.nextElementSibling.hidden=false" src="${esc(q.audio_url)}"></audio><p hidden role="alert" class="error">${esc(text('audioError'))}</p>`:`<p class="note">${esc(text('noAudio'))}</p>`;if(q.image_url&&/^https:\/\//.test(q.image_url))body+=`<a href="${esc(q.image_url)}" target="_blank" rel="noopener" aria-label="${esc(text('imageZoom'))}"><img class="question-image" src="${esc(q.image_url)}" alt="${esc(text('questionNo'))} ${q.number}" onerror="this.parentElement.nextElementSibling.hidden=false"></a><p hidden role="alert" class="error">${esc(text('imageError'))}</p><a class="image-zoom" href="${esc(q.image_url)}" target="_blank" rel="noopener">${esc(text('imageZoom'))}</a>`;if(q.passage)body+=`<div class="passage">${esc(q.passage)}</div>`;if(q.prompt)body+=`<h2>${esc(q.prompt)}</h2>`;body+=`<div class="answers">${q.options.map((o,i)=>`<button class="${state.selected===i?'selected':''}" onclick="choose(${i})" ${browse||state.result||state.busy?'disabled':''}>${String.fromCharCode(65+i)}　${esc(o)}</button>`).join('')}</div>`;if(answerIndex!==undefined)body+=`<div class="result ${state.result&&!state.result.correct?'wrong':''}">${state.result?esc(text(state.result.correct?'correct':'incorrect'))+'。 ':''}${esc(text('answer'))}：${String.fromCharCode(65+Number(answerIndex))}　${esc(q.options[answerIndex])}</div>`;body+=`<div class="row">${btn('move(-1)','previous','',state.index===0||state.busy)}${!browse&&!state.result?btn('submit()','submit','primary',state.selected===null||state.busy):btn(state.index===qs.length-1?'showRecords()':'move(1)',state.index===qs.length-1?'records':'next','primary',state.busy)}</div><p class="status">${state.busy?esc(text('saving')):state.result?esc(text('saved')):''}</p></section>`;}}
if(state.view==='records'){body=btn('home()','home','',state.busy)+`<h1>${esc(text('summary'))}</h1><p>${esc(text('answered'))}：${state.attempts.length}</p><div class="grid">`;for(const b of state.catalog.filter(c=>['demo','published'].includes(c.status))){const latest=unique(b),correct=latest.filter(a=>a.correct===true).length;body+=`<section class="card"><h2>${esc(label(b))}・${esc(text(b.skill))}</h2><p>${esc(text('progress'))}：${latest.length} / ${b.total}</p><p>${esc(text('rate'))}：${latest.length?Math.round(correct/latest.length*100)+'%':'—'}</p><div class="cells">`;const at=forBook(b).at(-1);for(const item of b.items){const n=item.number;const a=latest.find(a=>a.question_id===item.id);body+=`<button class="${a?a.correct?'correct':'wrong':''}" aria-label="${n} ${esc(text(a?a.correct?'correct':'incorrect':'unanswered'))}" onclick="state.mode='browse';openBook(state.catalog[${state.catalog.indexOf(b)}],'${esc(item.id)}')" ${state.busy?'disabled':''}>${n} ${a?a.correct?'✓':'×':'○'}</button>`;}body+=`</div>${at?`<p class="muted">${esc(text('recent'))}：${esc(new Date(at.answered_at).toLocaleString(state.lang==='zh'?'zh-TW':'th-TH',{timeZone:'Asia/Taipei'}))}</p>`:''}</section>`;}body+='</div>';}
if(state.error)body+=`<p role="alert" class="error">${esc(state.error)}</p>`;$('app').innerHTML=body;}
state.busy=!!state.token;
render();
init();
</script></body></html>
