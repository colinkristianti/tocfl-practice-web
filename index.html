const text=k=>state.messages[copyKeys[k]||k]?.[state.lang]||pageCopy[k]?.[state.lang]||state.messages[k]?.zh||pageCopy[k]?.zh||k;
const label=b=>`BAND ${b.band}・Volume ${b.volume}`;
const API_URL='https://script.google.com/macros/s/AKfycbwtUzCfumsbjWczGtk-0LpJxz3QLdC2ZWQi6U_dw15BpVUOXBUoZbmPS7mWgGc_fwxA/exec';
function uuid(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const a=crypto.getRandomValues(new Uint8Array(16));a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;const h=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}
function togglePassword(){const input=$('password'),button=$('passwordToggle');state.showPassword=!state.showPassword;input.type=state.showPassword?'text':'password';button.textContent=text(state.showPassword?'hidePassword':'showPassword');button.setAttribute('aria-pressed',String(state.showPassword));}
function rpc(method,...args){return new Promise((resolve,reject)=>{
  const id=uuid(), frame=document.createElement('iframe'), form=document.createElement('form');
  frame.name='tocfl-'+id;frame.hidden=true;frame.title='Background request';form.hidden=true;
  form.method='POST';form.action=API_URL;form.target=frame.name;
  const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({id,method,args,origin:location.origin});form.append(input);
  let timer;function finish(error,value){clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();error?reject(error):resolve(value);}
  function receive(event){let origin;try{origin=new URL(event.origin);}catch{return;}
    if(origin.protocol!=='https:'||!(origin.hostname==='script.google.com'||origin.hostname.endsWith('-script.googleusercontent.com')||origin.hostname==='script.googleusercontent.com'))return;
    const data=event.data;if(!data||data.channel!=='tocfl-rpc'||data.id!==id)return;
    data.ok?finish(null,data.result):finish(new Error(data.error||'REQUEST_FAILED'));
  }
  window.addEventListener('message',receive);timer=setTimeout(()=>finish(new Error('REQUEST_TIMEOUT')),45000);
  document.body.append(frame,form);form.submit();
});}
async function derived(password,salt){const e=new TextEncoder(),key=await crypto.subtle.importKey('raw',e.encode(password),'PBKDF2',false,['deriveBits']);const bytes=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(salt),iterations:600000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bytes),v=>v.toString(16).padStart(2,'0')).join('');}
function switchLanguage(){state.lang=state.lang==='zh'?'th':'zh';storageSet('localStorage','tocfl-language',state.lang);render();}
function recent(questionId){return state.attempts.filter(a=>a.question_id===questionId).at(-1);}
function forBook(b){const ids=new Set((b.items||[]).map(q=>q.id));return state.attempts.filter(a=>a.band===b.band&&Number(a.volume)===Number(b.volume)&&a.skill===b.skill&&ids.has(a.question_id));}
function unique(b){return Object.values(Object.fromEntries(forBook(b).map(a=>[a.question_id,a])));}
function clearSession(){state.navigationSerial++;state.token='';state.student=null;state.attempts=[];state.catalog=[];state.questions=[];state.book=null;state.result=null;state.view='login';state.bookCache.clear();state.filterBand='all';state.filterVolume='all';state.loginPassword='';state.showPassword=false;if(playback){playback.pause();playback=null;}storageRemove('localStorage','tocfl-session');storageRemove('sessionStorage','tocfl-session');}
window.addEventListener?.('storage',event=>{if(event.key==='tocfl-session'&&!event.newValue){clearSession();state.busy=false;state.error='';render();}});
function failure(err){const expired=/SESSION_EXPIRED/.test(String(err.message));if(expired){clearSession();}state.error=text(expired?'expired':/REQUEST_TIMEOUT/.test(String(err.message))?'timeout':'error');state.busy=false;render();}
function busy(){state.busy=true;state.error='';render();}
async function init(){const translations=rpc('bootstrap').then(b=>{state.messages={...state.messages,...b.messages};state.feedbackUrl=/^https:\/\//.test(b.feedbackUrl)?b.feedbackUrl:'';if(!state.busy)render();}).catch(()=>{});if(state.token){try{await refresh();}catch(err){failure(err);}}else{state.busy=false;render();}await translations;}
function applyDashboard(d){Object.assign(state,{student:d.student,catalog:d.catalog,attempts:d.attempts,view:'home',busy:false});}
async function refresh(){const token=state.token,d=await rpc('dashboard',token);if(token!==state.token)return;storageSet('localStorage','tocfl-session',token);storageRemove('sessionStorage','tocfl-session');applyDashboard(d);await restoreRoute();}
async function signIn(event){event.preventDefault();if(state.busy)return;state.loginEmail=$('email').value;state.loginPassword=$('password').value;const email=state.loginEmail,password=state.loginPassword;if(!globalThis.crypto?.subtle||typeof TextEncoder==='undefined'){state.error=text('loginCompatibility');render();return;}busy();try{const c=await rpc('loginStart',email),d=await derived(password,c.salt),r=await rpc('loginFinish',c.challenge,d);state.token=r.token;storageSet('localStorage','tocfl-session',r.token);state.loginPassword='';if(r.dashboard){applyDashboard(r.dashboard);await restoreRoute();}else await refresh();}catch(err){state.busy=false;state.error=text(/REQUEST_TIMEOUT/.test(String(err.message))?'timeout':/LOGIN_RATE_LIMIT/.test(String(err.message))?'loginRateLimit':'loginError');render();}}
async function signOut(){const token=state.token;clearSession();state.error='';state.busy=false;render();try{await rpc('logout',token);}catch(err){/* Local logout succeeds offline; server token expires after eight hours. */}}
async function home(){return setMode(state.mode==='type'?'type':'book');}
function writeRoute(push=false){if(!state.student||typeof location==='undefined'||typeof history==='undefined')return;let hash=state.view==='records'?'#/records':'#/'+state.mode;if(state.book&&['question','types','browse'].includes(state.view)){hash+='/'+state.book.band+'/'+state.book.skill+'/'+state.book.volume;if(state.type)hash+='/'+state.type;if(state.view==='question'&&activeQuestions()[state.index])hash+='?q='+activeQuestions()[state.index].number+(state.book.volume==='all'?'&id='+encodeURIComponent(activeQuestions()[state.index].question_id):'');}if(location.hash!==hash)history[push?'pushState':'replaceState'](null,'',hash);}
async function setMode(mode){if(state.busy)return;if(!['book','type','browse','records'].includes(mode))return;state.navigationSerial++;state.mode=mode==='records'?'book':mode;state.book=null;state.questions=[];state.type=null;state.error='';state.view=mode==='records'?'records':mode==='browse'?'browse':'home';writeRoute(true);render();if(mode==='browse'){const first=state.catalog.find(c=>['published','demo'].includes(c.status)&&c.total);if(first)await openBook(first,null,null,false);}}
async function restoreRoute(){if(!state.student){render();return;}const hash=typeof location==='undefined'?'':location.hash;const route=hash.replace(/^#\/?/,'').split('?')[0].split('/');const mode=['book','type','browse','records'].includes(route[0])?route[0]:'book';state.mode=mode==='records'?'book':mode;state.view=mode==='records'?'records':mode==='browse'?'browse':'home';state.book=null;state.questions=[];state.type=null;render();if(mode==='type'&&route[3]==='all'&&route[4]){await openTypeGroup(route[1],route[2],route[4],new URLSearchParams(hash.split('?')[1]||'').get('id'),false);return;}if(route.length>=4){const b=state.catalog.find(c=>c.band===route[1]&&c.skill===route[2]&&String(c.volume)===route[3]&&['published','demo'].includes(c.status)&&c.total);if(b){const number=Number(new URLSearchParams(hash.split('?')[1]||'').get('q'));const id=b.items?.find(q=>q.number===number)?.id;await openBook(b,id,route[4]||null,false);return;}}if(mode==='browse'){const b=state.catalog.find(c=>['published','demo'].includes(c.status)&&c.total);if(b)await openBook(b,null,null,false);}else writeRoute();}
window.addEventListener?.('hashchange',()=>{if(state.student){state.navigationSerial++;state.busy=false;restoreRoute().catch(failure);}});
function filterTypes(key,value){state[key]=value;render();}

async function openBook(b,questionId,selectedType=null,push=true){const token=state.token,serial=++state.navigationSerial;busy();try{state.book=b;const key=[state.token,b.band,b.volume,b.skill,state.mode==='browse'].join('|'),cached=state.bookCache.get(key);const questions=cached&&Date.now()-cached.at<60000?cached.questions:await rpc('loadBook',state.token,b.band,Number(b.volume),b.skill,state.mode==='browse');if(token!==state.token||serial!==state.navigationSerial)return;state.questions=questions;state.bookCache.set(key,{at:Date.now(),questions:state.questions});state.type=selectedType&&state.questions.some(q=>q.type===selectedType)?selectedType:null;state.index=questionId?Math.max(0,state.questions.findIndex(q=>q.question_id===questionId)):state.mode==='book'?Math.max(0,state.questions.findIndex(q=>!recent(q.question_id))):0;state.selected=null;state.result=null;state.pendingId=null;state.view=state.mode==='type'?(state.type?'question':'types'):state.mode==='browse'?'browse':'question';state.busy=false;if(state.type&&questionId)state.index=Math.max(0,activeQuestions().findIndex(q=>q.question_id===questionId));writeRoute(push);render();if(questionId&&state.mode==='browse')document.getElementById('browse-'+questionId)?.scrollIntoView();}catch(err){if(token===state.token&&serial===state.navigationSerial)failure(err);}}
async function openTypeGroup(band,skill,type,questionId=null,push=true){const token=state.token,serial=++state.navigationSerial;const books=state.catalog.filter(b=>b.band===band&&b.skill===skill&&['published','demo'].includes(b.status)&&b.total&&(b.items||[]).some(q=>q.type===type)).sort((a,b)=>Number(a.volume)-Number(b.volume));if(!books.length){state.view='home';writeRoute();render();return;}busy();try{const batches=await Promise.all(books.map(async b=>{const key=[token,b.band,b.volume,b.skill,false].join('|'),cached=state.bookCache.get(key);const questions=cached&&Date.now()-cached.at<60000?cached.questions:await rpc('loadBook',token,b.band,Number(b.volume),b.skill,false);if(token===state.token&&serial===state.navigationSerial)state.bookCache.set(key,{at:Date.now(),questions});return questions.filter(q=>q.type===type).map(q=>({...q,_book:b}));}));if(token!==state.token||serial!==state.navigationSerial)return;state.mode='type';state.book={band,skill,volume:'all'};state.questions=batches.flat();state.type=type;state.index=questionId?Math.max(0,state.questions.findIndex(q=>q.question_id===questionId)):0;state.selected=null;state.result=null;state.pendingId=null;state.view='question';state.busy=false;writeRoute(push);render();}catch(err){if(token===state.token&&serial===state.navigationSerial)failure(err);}}
function chooseType(type){state.type=type;state.index=0;state.view='question';writeRoute(true);render();}
function activeQuestions(){return state.type?state.questions.filter(q=>q.type===state.type):state.questions;}
function move(delta){state.index+=delta;state.selected=null;state.result=null;state.pendingId=null;state.error='';writeRoute();render();}
function choose(i){if(state.busy||state.result)return;state.selected=i;document.querySelectorAll('.answers button').forEach((b,n)=>b.classList.toggle('selected',n===i));const button=document.querySelector('[onclick=\"submit()\"]');if(button)button.disabled=false;}
async function submit(){if(state.selected===null||state.busy||state.result)return;const token=state.token,serial=state.navigationSerial,q=activeQuestions()[state.index];state.pendingId ||= uuid();busy();try{const r=await rpc('answer',state.token,q.question_id,state.selected,state.pendingId,state.mode==='type'?'type':'book');if(token!==state.token)return;if(serial!==state.navigationSerial){if(!state.attempts.some(a=>a.attempt_id===r.attempt_id))state.attempts.push(r);if(state.view==='records')render();return;}state.result={...r,explanation_zh:r.explanation_zh??q.explanation_zh,explanation_th:r.explanation_th??q.explanation_th,explanation_status:r.explanation_status??q.explanation_status};if(!state.attempts.some(a=>a.attempt_id===r.attempt_id))state.attempts.push(r);state.busy=false;render();}catch(err){if(token===state.token&&serial===state.navigationSerial)failure(err);}}
async function showRecords(){return setMode('records');}
function btn(action,key,cls='',disabled=false){return `<button class="${cls}" onclick="${action}" ${disabled?'disabled':''}>${esc(text(key))}</button>`;}
function render(){if($('brandSubtitle'))$('brandSubtitle').textContent=text('brandSubtitle');const oldAudio=document.querySelector('#app audio[data-practice]');if(oldAudio)playback=oldAudio;const audioPosition=playback?playback.currentTime:0,audioWasPlaying=playback&&!playback.paused;document.documentElement.lang=state.lang==='zh'?'zh-Hant':'th';$('language').textContent=state.lang==='zh'?'ภาษาไทย':'中文';$('studentName').textContent=state.student?`${text('hello')}，${state.student.name}`:'';$('logout').hidden=!state.student;$('logout').textContent=text('logout')+' · Log out';$('logout').disabled=false;$('credit').textContent=text('credit');$('notice').innerHTML=`<div class="note">${esc(text('demo'))}</div>`;if($('tabs')){$('tabs').hidden=!state.student;$('tabs').innerHTML=state.student?['book','type','browse','records'].map(m=>`<button onclick="setMode('${m}')" class="${(m==='records'?state.view==='records':state.view!=='records'&&state.mode===m)?'primary':''}" ${(m==='records'?state.view==='records':state.view!=='records'&&state.mode===m)?'aria-current="page"':''} ${state.busy?'disabled':''}>${esc(text(m))}</button>`).join(''):'';}let body='';
if(state.view==='login'&&state.busy&&state.token)body=`<section class="card login" role="status" aria-live="polite" aria-busy="true"><p>${esc(text('loading'))}</p></section>`;
else if(state.view==='login')body=`<section class="card login"><h1>${esc(text('login'))}</h1><p>${esc(text('accountHint'))}</p><p class="muted">${esc(text('loginNetworkHint'))}</p><form onsubmit="signIn(event)"><label for="email">Email</label><input id="email" type="email" autocapitalize="none" spellcheck="false" autocomplete="username" value="${esc(state.loginEmail)}" oninput="state.loginEmail=this.value" required ${state.busy?'disabled':''}><label for="password">${esc(text('password'))}</label><input id="password" type="${state.showPassword?'text':'password'}" autocapitalize="none" spellcheck="false" autocomplete="current-password" value="${esc(state.loginPassword)}" oninput="state.loginPassword=this.value" required maxlength="128" ${state.busy?'disabled':''}><button id="passwordToggle" type="button" onclick="togglePassword()" aria-controls="password" aria-pressed="${state.showPassword}" ${state.busy?'disabled':''}>${esc(text(state.showPassword?'hidePassword':'showPassword'))}</button><p class="status">${state.busy?`<span class="spinner" aria-hidden="true"></span> ${esc(text('loading'))} ${esc(text('pleaseWait'))}`:''}</p><button type="submit" class="primary wide" ${state.busy?'disabled':''}>${esc(text('enter'))}</button></form></section>`;
if(state.view==='home')body=state.mode==='type'?typeLandingHtml():bookLandingHtml();
if(state.view==='types'){body=btn('home()','home','',state.busy)+`<h1>${esc(label(state.book))}・${esc(text(state.book.skill))}</h1><h2>${esc(text('chooseType'))}</h2>`;body+=Array.from(new Set(state.questions.map(q=>q.type))).map(type=>`<p><button class="wide" onclick="chooseType('${esc(type)}')">${esc(text(type))}</button></p>`).join('');}
if(state.view==='question'){const qs=activeQuestions(),q=qs[state.index];body=btn('home()','home','',state.busy)+`<h1>${state.book.volume==='all'?'BAND '+esc(state.book.band)+'・'+esc(text(state.book.skill))+'・'+esc(text(state.type)):esc(label(state.book))+'・'+esc(text(state.book.skill))}</h1>`;if(!q)body+=`<p>${esc(text('noQuestions'))}</p>`;else {const browse=state.mode==='browse',answerIndex=browse?q.answer_index:state.result?.answerIndex;body+=`<section class="card question"><div class="row"><span>${state.book.volume==='all'?(state.index+1)+' / '+qs.length:esc(text('questionNo'))+' '+q.number+' / '+state.questions.length}</span><span>${esc(text(q.type))}</span></div>${q._book?`<p class="muted">${esc(fullBookLabel(q._book))}・${esc(text('questionNo'))} ${q.number}</p>`:''}<div class="bar"><span style="width:${(state.index+1)/qs.length*100}%"></span></div>`;if(state.book.skill==='listening')body+=q.audio_url&&/^https:\/\//.test(q.audio_url)?`<audio data-practice="${esc(q.question_id)}" controls controlslist="nodownload" preload="none" onerror="this.parentElement.querySelector('.audio-error').hidden=false" src="${esc(q.audio_url)}"></audio><p hidden role="alert" class="error audio-error">${esc(text('audioError'))}</p>`:`<p class="note">${esc(text('noAudio'))}</p>`;if(q.image_url&&/^https:\/\//.test(q.image_url))body+=`<a href="${esc(q.image_url)}" target="_blank" rel="noopener" aria-label="${esc(text('imageZoom'))}"><img class="question-image" src="${esc(q.image_url)}" alt="${esc(text('questionNo'))} ${q.number}" onerror="this.parentElement.nextElementSibling.hidden=false"></a><p hidden role="alert" class="error">${esc(text('imageError'))}</p><a class="image-zoom" href="${esc(q.image_url)}" target="_blank" rel="noopener">${esc(text('imageZoom'))}</a>`;if(q.passage)body+=`<div class="passage">${esc(q.passage)}</div>`;if(q.prompt)body+=`<h2>${esc(q.prompt)}</h2>`;body+=`<div class="answers">${q.options.map((o,i)=>`<button class="${state.selected===i?'selected':''}" onclick="choose(${i})" ${browse||state.result||state.busy?'disabled':''}>${String.fromCharCode(65+i)}　${esc(o)}</button>`).join('')}</div>`;if(answerIndex!==undefined)body+=`<div class="result ${state.result&&!state.result.correct?'wrong':''}">${state.result?'<strong>'+(state.result.correct?'✔ ':'✖ ')+esc(text(state.result.correct?'correct':'incorrect'))+'</strong>。 ':''}${esc(text('answer'))}：${String.fromCharCode(65+Number(answerIndex))}　${esc(q.options[answerIndex])}</div>`;if(state.result)body+=explanationHtml(state.result);body+=`<div class="row">${btn('move(-1)','previous','',state.index===0||state.busy)}${!browse&&!state.result?btn('submit()','submit','primary',state.selected===null||state.busy):btn(state.index===qs.length-1?'showRecords()':'move(1)',state.index===qs.length-1?'records':'next','primary',state.busy)}</div><p class="status">${state.busy?`<span class="spinner" aria-hidden="true"></span> ${esc(text('saving'))} ${esc(text('pleaseWait'))}`:state.result?esc(text('saved')):''}</p></section>`;}}
if(state.view==='browse')body=browseHtml();
if(state.view==='records'){body=btn('home()','home','',state.busy)+`<h1>${esc(text('summary'))}</h1><p>${esc(text('answered'))}：${state.attempts.length}</p><div class="grid">`;for(const b of state.catalog.filter(c=>['demo','published'].includes(c.status))){const latest=unique(b),correct=latest.filter(a=>a.correct===true).length;body+=`<section class="card"><h2>${esc(label(b))}・${esc(text(b.skill))}</h2><p>${esc(text('progress'))}：${latest.length} / ${b.total}</p><p>${esc(text('rate'))}：${latest.length?Math.round(correct/latest.length*100)+'%':'—'}</p><div class="cells">`;const at=forBook(b).at(-1);for(const item of b.items){const n=item.number;const a=latest.find(a=>a.question_id===item.id);body+=`<button class="${a?a.correct?'correct':'wrong':''}" aria-label="${n} ${esc(text(a?a.correct?'correct':'incorrect':'unanswered'))}" onclick="state.mode='browse';openBook(state.catalog[${state.catalog.indexOf(b)}],'${esc(item.id)}')" ${state.busy?'disabled':''}>${n} ${a?a.correct?'✓':'×':'○'}</button>`;}body+=`</div>${at?`<p class="muted">${esc(text('recent'))}：${esc(new Date(at.answered_at).toLocaleString(state.lang==='zh'?'zh-TW':'th-TH',{timeZone:'Asia/Taipei'}))}</p>`:''}</section>`;}body+='</div>';}
if(state.error)body+=`<p role="alert" class="error">${esc(state.error)}</p>`;if(state.busy&&state.view!=='login'&&state.view!=='question')body=`<div class="pending" role="status" aria-busy="true"><span class="spinner" aria-hidden="true"></span>${esc(text('loading'))} ${esc(text('pleaseWait'))}</div>`+body;$('app').innerHTML=body;
const slot=document.querySelector('#app audio[data-practice]');
if(slot){const same=playback&&playback.dataset.practice===slot.dataset.practice;if(same){slot.replaceWith(playback);playback.currentTime=audioPosition;if(audioWasPlaying)playback.play().catch(()=>audioFallback(playback));}else{if(playback)playback.pause();playback=slot;playback.play().catch(()=>audioFallback(playback));}}
else {if(playback)playback.pause();playback=null;}
}
function audioFallback(audio){if(!audio||!audio.isConnected||audio.nextElementSibling?.classList.contains('autoplay-hint'))return;const p=document.createElement('p');p.className='autoplay-hint muted';p.textContent=text('autoplayHint');audio.after(p);audio.addEventListener('play',()=>p.remove(),{once:true});}
function explanationHtml(q){const v=state.lang==='th'?q.explanation_th||q.explanation_zh:q.explanation_zh;if(!v)return '';return `<div class="explanation"><strong>${esc(text('explanation'))}</strong>${q.explanation_status!=='已校稿'?`<p class="muted">${esc(text('draft'))}</p>`:''}<p>${esc(v)}</p></div>`;}

function pageIntro(key){return `<div class="page-intro"><h1>${esc(text(key))}</h1><p>${esc(text(key+'Intro'))}</p></div>`;}
function fullBookLabel(b){return `BAND ${b.band}・${text(b.skill)}・Volume ${b.volume}`;}
function bookLandingHtml(){let body=`<section class="card official-callout"><h2>${esc(text('officialHeading'))}</h2><p>${esc(text('officialDescription'))}</p><p>${esc(text('officialPreparation'))}</p><details><summary>${esc(text('officialRequirements'))}</summary><p class="preserve-lines">${esc(text('officialHardware'))}</p><a href="https://tocfl.edu.tw/tocfl/index.php/exam/test/page/19" target="_blank" rel="noopener">${esc(text('sourceLink'))}</a></details><a class="official-button" href="https://cbt.sc-top.org.tw/sctopj/" target="_blank" rel="noopener">${esc(text('officialVisit'))}</a></section>`+pageIntro('book');if(!state.catalog.length)body+=`<p>${esc(text('noAccess'))}</p>`;for(const band of state.student.bands){body+=`<h2>BAND ${esc(band)}</h2><div class="grid">`;for(const volume of [...new Set(state.catalog.filter(c=>c.band===band).map(c=>Number(c.volume)))].sort((a,b)=>a-b)){body+=`<section class="card"><h2 class="tag">BAND ${esc(band)}・Volume ${volume}</h2>`;for(const b of state.catalog.filter(c=>c.band===band&&Number(c.volume)===volume)){const enabled=['published','demo'].includes(b.status)&&b.total>0,count=unique(b).length;body+=`<div class="record"><div class="row"><strong>${esc(text(b.skill))}</strong><span>${enabled?count+' / '+b.total:esc(text('unavailable'))}</span></div><div class="bar"><span style="width:${b.total?Math.min(100,count/b.total*100):0}%"></span></div>${btn(`openBook(state.catalog[${state.catalog.indexOf(b)}])`,!enabled?'unavailable':count&&count<b.total?'continue':'start','wide',!enabled||state.busy)}</div>`;}body+='</section>';}body+='</div>';}return body+`<div class="row record">${state.feedbackUrl?`<a href="${esc(state.feedbackUrl)}" target="_blank" rel="noopener">${esc(text('feedback'))}</a>`:''}</div>`;}
function typeLandingHtml(){let body=pageIntro('type');for(const band of state.student.bands){body+=`<section class="card band-guide band-${esc(band)}"><h2>${esc(text(band==='A'?'bandATitle':'bandBTitle'))}</h2><p>${esc(text(band==='A'?'bandAListeningGuide':'bandBListeningGuide'))}</p><p>${esc(text(band==='A'?'bandAReadingGuide':'bandBReadingGuide'))}</p></section>`;for(const skill of ['listening','reading']){const books=state.catalog.filter(b=>b.band===band&&b.skill===skill&&['published','demo'].includes(b.status)&&b.total);const groups=new Map();for(const b of books)for(const q of b.items||[])if(q.type)groups.set(q.type,(groups.get(q.type)||0)+1);body+=`<section class="type-section"><h3>${skill==='listening'?'♫':'▤'} ${esc(text(skill))}</h3><div class="grid">`;for(const [type,count] of groups)body+=`<section class="card type-card"><p class="tag">BAND ${esc(band)}・${esc(text(skill))}</p><h3>${esc(text(type))}</h3><p class="muted">${count} ${esc(text('questionNo'))}</p>${btn(`openTypeGroup('${esc(band)}','${skill}','${esc(type)}')`,'start','primary',state.busy)}</section>`;if(!groups.size)body+=`<p class="muted">${esc(text('noQuestions'))}</p>`;body+='</div></section>';}}return body+`<section class="card bank-notes"><h2>${esc(text('bankNoteHeading'))}</h2><p class="preserve-lines">${esc(text('bankNote'))}</p><h2>${esc(text('bankCopyrightHeading'))}</h2><p>${esc(text('bankCopyright'))}</p><div class="row"><a href="https://tocfl.edu.tw/tocfl/index.php/exam/test/page/1?pressBtn=(%E9%A1%8C%E5%BA%AB)" target="_blank" rel="noopener">${esc(text('sourceLink'))}</a><a href="https://tocfl.edu.tw/tocfl/index.php/exam/study_resources" target="_blank" rel="noopener">${esc(text('learningResources'))}</a></div></section>`;}
function browseHtml(){const b=state.book;let sidebar='';for(const band of state.student?.bands||[]){sidebar+=`<h3>BAND ${esc(band)}</h3>`;for(const skill of ['listening','reading']){const books=state.catalog.filter(c=>c.band===band&&c.skill===skill).sort((a,b)=>Number(a.volume)-Number(b.volume));if(!books.length)continue;sidebar+=`<h4>${esc(text(skill))}</h4>`;sidebar+=books.map(c=>btn(`openBook(state.catalog[${state.catalog.indexOf(c)}])`,'Volume '+c.volume,c===b?'primary':'',state.busy||!['published','demo'].includes(c.status)||!c.total)).join('');}}return pageIntro('browse')+`<div class="browse-layout"><aside class="card browse-nav" aria-label="${esc(text('selectBook'))}">${sidebar}</aside><div>${b?`<h2>${esc(fullBookLabel(b))}</h2>`:`<section class="card empty-state">${esc(text('noAccess'))}</section>`}${state.questions.map(q=>`<section id="browse-${esc(q.question_id)}" class="card browse-item record"><h2>${esc(text('questionNo'))} ${q.number} · ${esc(text(q.type))}</h2>${q.audio_url&&/^https:\/\//.test(q.audio_url)?`<audio controls preload="none" src="${esc(q.audio_url)}" onplay="document.querySelectorAll('audio').forEach(a=>{if(a!==this)a.pause()})"></audio>`:''}${q.image_url&&/^https:\/\//.test(q.image_url)?`<a href="${esc(q.image_url)}" target="_blank" rel="noopener"><img class="question-image" loading="lazy" decoding="async" src="${esc(q.image_url)}" alt="${esc(text('questionNo'))} ${q.number}"></a>`:''}${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${q.prompt?`<h3>${esc(q.prompt)}</h3>`:''}<details class="browse-answer"><summary>${esc(text('revealAnswer'))}</summary><div class="result">${esc(text('answer'))}：${String.fromCharCode(65+Number(q.answer_index))}</div>${explanationHtml(q)}</details></section>`).join('')}</div></div>`;}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(entries=>{document.documentElement.style.setProperty('--header-height',entries[0].target.getBoundingClientRect().height+'px');}).observe(document.querySelector('header'));

state.busy=!!state.token;
render();
init();
</script></body></html>
